[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graphclip"
version = "0.1.0"
description = "Graph-enhanced vision-language model for semantic and relational image-text queries"
readme = "README.md"
requires-python = ">=3.10"

dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools]
packages = [
    "graphclip",
    "core",
    "model",
    "inference",
    "data",
    "relation",
    "pipline"
]